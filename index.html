<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大阪オールスターズJr 8期生</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大阪オールスターズJr 8期生">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080f1a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23080f1a'/%3E%3Ctext x='90' y='115' text-anchor='middle' font-size='90' fill='%23f0a500'%3E⚾%3C/text%3E%3C/svg%3E">
<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@400;600;700&display=swap');
:root{
  --bg:#080f1a;--s1:#0d1b2e;--s2:#132338;--s3:#1a2e47;
  --border:#1e3550;--border2:#2a4a6e;
  --gold:#f0a500;--gold2:#ffc83d;--blue:#3da8ff;--green:#2ecc71;--red:#e74c3c;
  --text:#e8f4ff;--text2:#7ca3c8;--text3:#4a7099;
  --tg:#25a050;--tb:#666;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:calc(var(--vh,1vh)*100);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:99999;background:#080f1a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s;}
#splash.hide{opacity:0;pointer-events:none;}
#splash em{font-size:70px;font-style:normal;}
#splash h1{font-family:'Oswald',sans-serif;font-size:26px;color:var(--gold);letter-spacing:4px;}
#splash p{font-size:13px;color:var(--text3);}

/* HEADER */
.hdr{background:linear-gradient(90deg,#080f1a,#0d1b2e);border-bottom:2px solid var(--gold);
  padding:6px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;transition:border-color .3s;
  flex-wrap:wrap;}
.hdr-logo{font-family:'Oswald',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2px;}
.team-sw{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:18px;padding:2px;}
.tbtn{padding:4px 10px;border-radius:14px;font-size:13px;font-weight:700;font-family:'Noto Sans JP',sans-serif;
  border:none;background:none;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.tbtn.og{background:var(--tg);color:#fff;} .tbtn.ob{background:var(--tb);color:#fff;}
.tabs{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:18px;padding:2px;}
.tab{padding:4px 9px;border-radius:14px;font-size:13px;font-weight:700;font-family:'Noto Sans JP',sans-serif;
  border:none;background:none;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab.on{background:var(--gold);color:#000;}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:4px;}
#sync-badge{font-size:11px;color:var(--text3);opacity:0;transition:opacity .3s;white-space:nowrap;}
.sm-btn{background:none;border:1px solid var(--border2);color:var(--text3);
  padding:3px 7px;border-radius:10px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}

/* LAYOUT */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.page{display:none;flex:1;overflow:hidden;}
.page.on{display:flex;}

/* ── LINEUP PAGE ── */
#pg-lineup{flex-direction:row;}
.order-panel{width:50%;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;}
.field-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.panel-hdr{background:var(--s2);border-bottom:1px solid var(--border);
  padding:5px 8px;display:flex;align-items:center;gap:5px;flex-shrink:0;}
.panel-title{font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold);letter-spacing:1px;}
.panel-hint{font-size:11px;color:var(--text3);margin-left:auto;}

.order-list{flex:1;overflow-y:auto;padding:4px;}
.order-list::-webkit-scrollbar{width:3px;}
.order-list::-webkit-scrollbar-thumb{background:var(--border2);}

/* Order row */
.orow{display:flex;align-items:center;gap:4px;padding:6px 7px;
  background:var(--s1);border:1px solid var(--border);border-radius:7px;margin-bottom:3px;
  position:relative;user-select:none;-webkit-user-select:none;cursor:pointer;
  transition:border-color .12s,background .12s,opacity .12s;}
.orow.tg{border-left:3px solid var(--tg);}
.orow.tb{border-left:3px solid var(--tb);}
.orow.sel{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold2);background:rgba(255,200,61,.12);}
.orow.tgt{border-color:var(--blue);background:rgba(61,168,255,.08);}
.orow.out{opacity:.38;pointer-events:none;border-color:var(--red);}
.orow.bench{border-style:dashed;opacity:.75;}
.onum{font-family:'Oswald',sans-serif;font-size:18px;color:var(--gold);width:17px;text-align:center;flex-shrink:0;}
.onum.b{color:var(--text3);font-size:14px;}
.oinfo{flex:1;min-width:0;}
.oname{font-size:14px;font-weight:700;line-height:1.2;}
.okana{font-size:11px;color:var(--text3);}
.ojersey{font-family:'Oswald',sans-serif;font-size:17px;color:var(--blue);flex-shrink:0;width:22px;text-align:right;}
.pchip{font-size:11px;font-weight:700;padding:2px 4px;border-radius:8px;flex-shrink:0;min-width:26px;text-align:center;}
.pc-none{background:var(--border);color:var(--text3);}
.pc-P{background:#c0392b;color:#fff;}.pc-C{background:#7d3c98;color:#fff;}
.pc-1B{background:#1a5276;color:#fff;}.pc-2B{background:#0e6655;color:#fff;}
.pc-3B{background:#1e8449;color:#fff;}.pc-SS{background:#2471a3;color:#fff;}
.pc-LF{background:#6e2f1a;color:#fff;}.pc-CF{background:#117a65;color:#fff;}
.pc-RF{background:#7b7d7d;color:#fff;}.pc-DH{background:#935116;color:#fff;}
.sub-badge{font-size:11px;background:var(--red);color:#fff;padding:1px 4px;border-radius:6px;font-weight:700;flex-shrink:0;}
.bench-div{text-align:center;font-size:11px;color:var(--text3);padding:3px 0;letter-spacing:2px;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:3px 0;background:var(--bg);}
.swap-bar{display:none;position:sticky;bottom:0;background:rgba(240,165,0,.18);border-top:1px solid var(--gold);
  padding:5px 10px;font-size:13px;color:var(--gold2);font-weight:700;text-align:center;z-index:10;gap:8px;align-items:center;justify-content:center;}
.swap-bar.show{display:flex;}

/* Field */
.field-body{flex:1;position:relative;overflow:hidden;}
.field-svg{position:absolute;inset:0;width:100%;height:100%;}
.field-slots{position:absolute;inset:0;}
.fslot{position:absolute;transform:translate(-50%,-50%);cursor:pointer;}
.fsi{background:rgba(8,15,26,.9);border:1.5px solid var(--border2);border-radius:6px;
  padding:3px 5px;text-align:center;white-space:nowrap;transition:all .2s;min-width:54px;}
.fsi.has{border-color:var(--gold);}
.fsi.pressing{border-color:var(--blue);box-shadow:0 0 10px rgba(61,168,255,.5);transform:scale(1.06);}
.fsi-pos{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px;}
.fsi-name{font-size:12px;font-weight:700;color:var(--text);}
.fsi-empty{color:var(--text3);}
.fsi-num{font-size:11px;color:var(--text2);}

/* ── PITCHER PAGE ── */
#pg-pitcher{flex-direction:column;overflow:hidden;}
.pitcher-body{flex:1;overflow-y:auto;padding:8px;}
.pitch-row{display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--s1);border:1px solid var(--border);border-radius:9px;margin-bottom:4px;
  cursor:grab;user-select:none;transition:all .15s;}
.pitch-row.dragging{opacity:.3;}.pitch-row.drag-over{border-color:var(--gold);}
.pitch-row.ap{border-color:var(--green);background:rgba(46,204,113,.1);}
.pitch-row.dp{opacity:.4;}
.pseq{font-family:'Oswald',sans-serif;font-size:22px;color:var(--gold);width:20px;flex-shrink:0;}
.pinfo{flex:1;}.pname{font-size:15px;font-weight:700;}.pkana{font-size:11px;color:var(--text3);}
.pnum{font-family:'Oswald',sans-serif;font-size:18px;color:var(--blue);}
.pstat{font-size:13px;font-weight:700;padding:2px 7px;border-radius:9px;}
.ps-n{background:var(--s3);color:var(--text2);}.ps-a{background:var(--green);color:#000;}.ps-d{background:var(--border);color:var(--text3);}
.btn-np{width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;border:none;border-radius:9px;font-size:16px;font-weight:900;font-family:'Noto Sans JP',sans-serif;
  cursor:pointer;margin-bottom:10px;transition:all .2s;}
.btn-np:active{transform:scale(.97);}
.pitch-add{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:9px;}
.padd-title{font-size:13px;color:var(--text2);margin-bottom:7px;font-weight:700;}
.padd-row{display:flex;gap:5px;}
select.psel{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:7px 8px;font-family:'Noto Sans JP',sans-serif;font-size:14px;}
.btn-ap{padding:7px 12px;background:var(--blue);color:#000;border:none;border-radius:6px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}

/* ── SUB PAGE ── */
.sub-body{flex:1;overflow-y:auto;padding:8px;}
.sub-ui{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:12px;}
.sub-ui-title{font-family:'Oswald',sans-serif;font-size:15px;color:var(--gold);margin-bottom:9px;}
.sub-slots{display:flex;gap:7px;margin-bottom:10px;}
.sslot{flex:1;background:var(--s2);border:1.5px dashed var(--border2);border-radius:9px;
  padding:9px 7px;text-align:center;min-height:64px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.sslot.filled{border-style:solid;border-color:var(--gold);background:rgba(240,165,0,.08);}
.sslot-lbl{font-size:12px;color:var(--text3);margin-bottom:3px;}
.sslot-name{font-size:14px;font-weight:700;}.sslot-num{font-size:12px;color:var(--blue);}
.sslot-empty{font-size:13px;color:var(--text3);}
.sub-arr{display:flex;align-items:center;justify-content:center;color:var(--red);font-size:22px;}
.btn-sub{width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:8px;
  font-size:15px;font-weight:900;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .2s;}
.btn-sub:active{transform:scale(.97);}.btn-sub:disabled{opacity:.35;pointer-events:none;}
.log-hdr{background:var(--s2);border:1px solid var(--border);border-radius:9px 9px 0 0;
  padding:6px 10px;font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold);}
.log-list{background:var(--s1);border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;}
.log-item{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;}
.log-item:last-child{border-bottom:none;}
.log-out{color:var(--text2);}.log-arr{color:var(--red);font-size:15px;}.log-in{color:var(--blue);font-weight:700;}
.log-pos{color:var(--gold);font-size:11px;margin-left:auto;}
.log-empty{padding:12px;text-align:center;color:var(--text3);font-size:13px;}

/* ── SETTINGS PAGE ── */
#pg-settings{flex-direction:column;overflow:hidden;}
.settings-body{flex:1;overflow-y:auto;padding:8px;}
.settings-body::-webkit-scrollbar{width:3px;}
.sec-title{font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold);
  padding:5px 9px;background:var(--s2);border:1px solid var(--border);
  border-radius:7px 7px 0 0;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.sec-list{background:var(--s1);border:1px solid var(--border);border-top:none;border-radius:0 0 7px 7px;}
.per{display:flex;align-items:center;gap:5px;padding:7px 9px;border-bottom:1px solid var(--border);font-size:13px;}
.per:last-child{border-bottom:none;}
.per-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.per-dot.g{background:var(--tg);}.per-dot.b{background:var(--tb);}
.per-name{flex:1;min-width:0;}.per-nm{font-size:14px;font-weight:700;}.per-kn{font-size:11px;color:var(--text3);}
.per-num{font-family:'Oswald',sans-serif;font-size:15px;color:var(--blue);min-width:22px;text-align:right;}
.btn-ed{padding:3px 8px;background:var(--s3);border:1px solid var(--border2);color:var(--text2);
  border-radius:7px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;flex-shrink:0;}
.btn-dl{padding:3px 7px;background:rgba(231,76,60,.15);border:1px solid var(--red);color:var(--red);
  border-radius:7px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;flex-shrink:0;}
.btn-add-p{width:100%;padding:10px;background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#000;border:none;border-radius:8px;font-size:15px;font-weight:900;
  font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-bottom:10px;transition:all .2s;}
.ftabs{display:flex;gap:4px;margin-bottom:8px;}
.ftab{flex:1;padding:6px;border-radius:7px;border:1px solid var(--border);background:var(--s2);
  color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;text-align:center;
  transition:all .2s;font-family:'Noto Sans JP',sans-serif;}
.ftab.fa{background:var(--gold);color:#000;border-color:var(--gold);}
.ftab.fg{background:var(--tg);color:#fff;border-color:var(--tg);}
.ftab.fb{background:var(--tb);color:#fff;border-color:var(--tb);}
.sec-wrap{margin-bottom:12px;}
.btn-bench{
  font-size:13px;padding:3px 7px;border-radius:7px;
  background:rgba(61,168,255,.15);border:1px solid var(--blue);color:var(--blue);
  cursor:pointer;flex-shrink:0;font-family:'Noto Sans JP',sans-serif;
  transition:all .15s;
}
.btn-stamen{
  font-size:13px;padding:3px 7px;border-radius:7px;
  background:rgba(37,160,80,.15);border:1px solid var(--tg);color:var(--tg);
  cursor:pointer;flex-shrink:0;font-family:'Noto Sans JP',sans-serif;
  transition:all .15s;
}

/* ── PICKER SHEET ── */
.psheet{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;background:rgba(0,0,0,.55);}
.psheet.open{display:flex;}
.pinner{margin-top:auto;background:var(--s1);border-top:2px solid var(--gold);
  border-radius:16px 16px 0 0;max-height:68vh;display:flex;flex-direction:column;}
.phdr{padding:11px 14px 7px;display:flex;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;}
.ptitle{font-family:'Oswald',sans-serif;font-size:15px;color:var(--gold);flex:1;letter-spacing:1px;}
.pclose{background:none;border:1px solid var(--border2);color:var(--text2);padding:3px 9px;
  border-radius:10px;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.plist{overflow-y:auto;padding:6px;}
.plist::-webkit-scrollbar{width:3px;}
.pi{display:flex;align-items:center;gap:7px;padding:8px 9px;background:var(--s2);
  border:1px solid var(--border);border-radius:7px;margin-bottom:3px;cursor:pointer;transition:all .15s;}
.pi:active{background:rgba(240,165,0,.15);border-color:var(--gold);}
.pi-info{flex:1;min-width:0;}.pi-name{font-size:14px;font-weight:700;}.pi-kana{font-size:11px;color:var(--text3);}
.pi-num{font-family:'Oswald',sans-serif;font-size:17px;color:var(--blue);}
.pi-pos{font-size:11px;font-weight:700;padding:2px 4px;border-radius:7px;}

/* ── MODALS ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;}
.mbg.open{display:flex;}
.mbox{background:var(--s1);border:1.5px solid var(--gold);border-radius:14px;padding:14px;width:88%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.mbox-blue{background:var(--s1);border:1.5px solid var(--blue);border-radius:14px;padding:14px;width:88%;max-width:380px;}
.mtitle{font-family:'Oswald',sans-serif;font-size:16px;color:var(--gold);margin-bottom:11px;}
.mtitle-b{font-family:'Oswald',sans-serif;font-size:16px;color:var(--blue);margin-bottom:11px;}
.pos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:11px;}
.pgb{padding:8px 3px;border-radius:6px;border:1px solid var(--border);background:var(--s2);color:var(--text2);
  font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;font-family:'Noto Sans JP',sans-serif;line-height:1.3;}
.pgb.sel{background:var(--gold);color:#000;border-color:var(--gold);}
.pgb small{font-size:10px;font-weight:400;display:block;}
.mbtns{display:flex;gap:7px;}
.btn-c{flex:1;padding:9px;border-radius:7px;background:var(--s2);color:var(--text2);border:1px solid var(--border);font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.btn-ok{flex:1;padding:9px;border-radius:7px;background:var(--gold);color:#000;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.btn-okb{flex:1;padding:9px;border-radius:7px;background:var(--blue);color:#000;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.erow{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.elbl{font-size:12px;color:var(--text2);font-weight:700;min-width:48px;flex-shrink:0;}
.einput{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;
  padding:8px 9px;font-family:'Noto Sans JP',sans-serif;font-size:15px;}
.einput:focus{outline:none;border-color:var(--blue);}
.tradio{display:flex;gap:5px;flex:1;}
.trb{flex:1;padding:7px;border-radius:7px;border:1.5px solid var(--border);background:var(--s2);
  color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;text-align:center;
  transition:all .2s;font-family:'Noto Sans JP',sans-serif;}
.trb.og{background:var(--tg);color:#fff;border-color:var(--tg);}
.trb.ob{background:var(--tb);color:#fff;border-color:var(--tb);}
.fa-sel{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:7px;
  padding:9px;font-family:'Noto Sans JP',sans-serif;font-size:14px;margin-bottom:11px;}
@keyframes pr{from{opacity:.6;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
.pr{position:fixed;width:48px;height:48px;border:2px solid var(--blue);border-radius:50%;pointer-events:none;animation:pr .5s ease-out forwards;z-index:9998;}
/* 6人制ボタン */
.rule-sw{display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:18px;padding:2px;}
.rbtn{padding:4px 9px;border-radius:14px;font-size:11px;font-weight:700;font-family:'Noto Sans JP',sans-serif;
  border:none;background:none;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.rbtn.on9{background:var(--gold);color:#000;}
.rbtn.on6{background:var(--red);color:#fff;}
.fslot.hidden{display:none;}

/* タブレット（768px以上）で名前を大きく */
@media(min-width:768px){
  .td-name-main{font-size:20px;}
  .td-name-kana{font-size:11px;}
  .td-order-num{font-size:22px;}
  .td-posnum{font-size:18px;}
  .td-posname{font-size:9px;}
  .td-num{font-size:20px;width:36px;}
  .td-order{width:30px;}
  .td-pos{width:38px;}
  .btn-bench,.btn-stamen{font-size:15px;padding:5px 12px;}
  .sub-badge{font-size:11px;}
  .member-table th{font-size:11px;padding:5px 4px;}
}

];

let fieldAssign={green:{P:null,C:null,'1B':null,'2B':null,'3B':null,SS:null,LF:null,CF:null,RF:null},
                 black:{P:null,C:null,'1B':null,'2B':null,'3B':null,SS:null,LF:null,CF:null,RF:null}};

// UI state

let posModalPid=null, posModalSel=null;

// helpers

// ══════════════════════════════════

const OUTFIELD=['LF','CF','RF'];
function setRule(n){

// ── 打順を詰め直す（スタメンのorder番号を1から連番に整理）──
function reorderStamen(team) {
  const t = team||currentTeam;
  players.filter(p=>p.team===t&&p.inStamen)
    .sort((a,b)=>a.order-b.order)
    .forEach((p,i)=>p.order=i+1);

// ══════════════════════════════════
// TABS

// ══════════════════════════════════
// RENDER
// ══════════════════════════════════
function renderAll(){ renderOrderList(); renderFieldSlots(); }

function renderOrderList(){
  const stamen=mine().filter(p=>p.inStamen).sort((a,b)=>a.order-b.order);
  const bench =mine().filter(p=>!p.inStamen);
  const el=document.getElementById('order-list');

    <table class="member-table">
      <thead>
        <tr>
          <th>打順</th><th>守備</th><th>選手名</th><th>番号</th><th></th>

      </thead>
      <tbody>
        ${stamen.map(p=>orowHTML(p,true)).join('')}
        <tr class="bench-div-row"><td colspan="5">── ベンチ ──</td></tr>
        ${bench.map(p=>orowHTML(p,false)).join('')}
      </tbody>
    </table>`;
}

function orowHTML(p,isStamen){
  const posNum  = POS_NUM[p.pos] || '';
  const posName = POS_JP[p.pos]  || '';
  const sc  = swapFirstId===p.id?' sel':'';
  const tc  = swapFirstId&&swapFirstId!==p.id&&!p.subbedOut?' tgt':'';
  const oc  = p.subbedOut?' out':(!isStamen?' bench':'');
  const tc2 = currentTeam==='green'?' tg':' tb';
  const moveBtn = p.subbedOut ? `<span class="sub-badge">交</span>` : isStamen
    ? `<button class="btn-bench" data-bench="${p.id}" onclick="moveToBench(${p.id},event)">↓</button>`
    : `<button class="btn-stamen" data-up="${p.id}" onclick="moveToStamen(${p.id},event)">↑</button>`;
  return `<tr class="mrow${sc}${tc}${oc}${tc2}" data-id="${p.id}" data-stamen="${isStamen?1:0}">
    <td class="td-order">
      ${isStamen
        ? `<div class="td-order-num">${p.order}</div>`
        : `<div class="td-order-num b">B</div>`}
    </td>
    <td class="td-pos">

      <div class="td-posname">${p.pos!=='―'?p.pos:''}</div>
    </td>

      <div class="td-name-kana">${p.kana}</div>
    </td>

}

// ── イベント委譲：order-listに一つだけリスナー ──
(function(){
  let pressTimer=null, pressId=null, didLong=false, lastTouchId=null, lastTouchTime=0;
  const el=()=>document.getElementById('order-list');

  function getRow(e){
    if(e.target.closest('.btn-bench,.btn-stamen')) return null;
    return e.target.closest('.mrow');
  }

  function startPress(id){
    pressId=id; didLong=false;
    pressTimer=setTimeout(()=>{
      didLong=true;
      openPosModal(id);
    },500);
  }
  function cancelPress(){ clearTimeout(pressTimer); }

  function doTap(id){
    if(didLong)return;
    const p=players.find(x=>x.id===id);
    if(!p||p.subbedOut)return;
    if(swapFirstId===null){
      swapFirstId=id;
      document.getElementById('swap-bar').classList.add('show');
      renderOrderList();
    } else if(swapFirstId===id){
      cancelSwap();
    } else {
      doSwap(swapFirstId,id);
    }
  }

  // スクリプトはbody末尾なのでDOM構築済み、直接実行
  (()=>{
    const container=document.getElementById('order-list');

    container.addEventListener('touchstart',e=>{
      const row=getRow(e);
      if(!row)return;
      startPress(+row.dataset.id);
    },{passive:true});

    container.addEventListener('touchend',e=>{
      const row=getRow(e);
      cancelPress();
      if(!row)return;
      const id=+row.dataset.id;
      const now=Date.now();
      // 同じタッチIDの二重発火を防ぐ
      if(lastTouchId===id&&now-lastTouchTime<300)return;
      lastTouchId=id; lastTouchTime=now;
      doTap(id);
    },{passive:true});

    container.addEventListener('touchcancel',()=>cancelPress(),{passive:true});

    // mouseはタッチ非対応環境（PC確認）用
    container.addEventListener('mousedown',e=>{
      const row=getRow(e);
      if(!row)return;
      startPress(+row.dataset.id);
    });
    container.addEventListener('mouseup',e=>{
      const row=getRow(e);
      cancelPress();
      if(!row)return;
      // touchendが既に処理していたら300ms以内は無視
      if(Date.now()-lastTouchTime<300)return;
      doTap(+row.dataset.id);
    });
  })();
})();

// ↓ スタメン→ベンチ（人数問わず）
function moveToBench(id, e){
  e.stopPropagation();
  const p=players.find(x=>x.id===id); if(!p||!p.inStamen)return;
  p.inStamen=false; p.order=null;
  reorderStamen();
  // fieldAssignからも除去
  Object.keys(fa()).forEach(k=>{ if(fa()[k]===id)fa()[k]=null; });
  saveState(); toast(`${p.name} をベンチへ`); renderAll();
}

// ↑ ベンチ→スタメン末尾へ追加（ポジション引き継ぎ）
function moveToStamen(id, e){
  e.stopPropagation();
  const p=players.find(x=>x.id===id); if(!p||p.inStamen)return;
  const maxOrd=Math.max(0,...mine().filter(x=>x.inStamen).map(x=>x.order));
  p.inStamen=true; p.order=maxOrd+1;
  // ポジションが設定済みなら fieldAssign も復元（重複なければ）
  if(p.pos!=='―'&&p.pos!=='DH'){
    const posKey=p.pos;
    if(FPOS[posKey]!==undefined){ // 有効なフィールドポジション
      if(!fa()[posKey]){ // 空いていれば配置
        fa()[posKey]=p.id;
      }
    }
  }
  saveState(); toast(`${p.name} をスタメンへ（${p.pos!=='―'?p.pos:'ポジション未定'}）`); renderAll();
}

function cancelSwap(){
  swapFirstId=null;
  document.getElementById('swap-bar').classList.remove('show');
  renderOrderList();
}

function doSwap(idA,idB){
  const a=players.find(p=>p.id===idA), b=players.find(p=>p.id===idB);
  if(!a||!b)return;

  if(a.inStamen&&b.inStamen){
    // 打順番号を交換
    [a.order,b.order]=[b.order,a.order];
    toast(`${a.name} ↔ ${b.name}`);
  } else {
    // スタメン↔ベンチ入替
    const s=a.inStamen?a:b, bn=a.inStamen?b:a;
    bn.inStamen=true; bn.order=s.order;
    s.inStamen=false; s.order=null;

    // sのポジションを取得してbnに引き継ぐ（ポジション交換）
    const sPos=s.pos;
    const bnPos=bn.pos;

    // fieldAssign: s→外す、bn→sのポジションへ
    Object.keys(fa()).forEach(k=>{ if(fa()[k]===s.id) fa()[k]=null; });
    Object.keys(fa()).forEach(k=>{ if(fa()[k]===bn.id) fa()[k]=null; });

    if(sPos!=='―'&&sPos!=='DH'&&FPOS[sPos]!==undefined){
      // bnをsのポジションに配置
      bn.pos=sPos;
      fa()[sPos]=bn.id;
    }
    // sはポジションなしへ
    s.pos='―';

    reorderStamen();
    toast(`${bn.name}(${sPos!=='―'?sPos:'未定'}) ↔ ${s.name} 入替`);
  }
  swapFirstId=null;
  document.getElementById('swap-bar').classList.remove('show');
  saveState(); renderAll();
}

}
function selPos(pos){ posModalSel=pos; document.querySelectorAll('#pos-grid .pgb').forEach(b=>b.classList.toggle('sel',b.dataset.pos===pos)); }
function confirmPos(){
  const p=players.find(x=>x.id===posModalPid); if(!p)return;
  if(posModalSel!=='―'&&posModalSel!=='DH'){
    // Aの旧ポジションを記録
    const aOldPos = Object.keys(fa()).find(k=>fa()[k]===p.id) || null;
    // そのポジションにいる既存選手Bを記録
    const prevId = fa()[posModalSel];
    const prev = prevId ? players.find(x=>x.id===prevId) : null;
    // Aの旧ポジションからAを外す
    if(aOldPos) fa()[aOldPos]=null;
    // BをAの旧ポジションへ移動（スワップ）
    if(prev && aOldPos){
      prev.pos=aOldPos;
      fa()[aOldPos]=prev.id;
    } else if(prev){
      prev.pos='―';
    }
    // Aをセレクトされたポジションへ
    fa()[posModalSel]=p.id;
    p.pos=posModalSel;
    const msg = prev
      ? `${p.name}↔${prev.name} ポジション交換`
      : `${p.name} → ${posModalSel}`;
    closePosModal(); saveState(); toast(msg); renderAll();
  } else {
    // '―' or 'DH' の場合はfield解除のみ
    Object.keys(fa()).forEach(k=>{ if(fa()[k]===p.id) fa()[k]=null; });
    p.pos=posModalSel;
    closePosModal(); saveState(); toast(`${p.name} → ${posModalSel}`); renderAll();
  }
}

        : `${p.name} #${p.num??'—'}`;
      return `<option value="${p.id}" ${isCurrent?'selected':''} class="${isAssigned&&!isCurrent?'assigned':''}">${label}</option>`;

function closeFaModal(){ document.getElementById('fa-modal').classList.remove('open'); }
function confirmFa(){

    const p=players.find(x=>x.id===pid);
    // Aの旧ポジションを記録

    // そのポジションにいる既存選手Bを記録
    const prevId=fa()[faModalPos];
    const prev=prevId&&prevId!==pid ? players.find(x=>x.id===prevId) : null;
    // Aの旧ポジションからAを外す
    if(aOldPos) fa()[aOldPos]=null;
    // BをAの旧ポジションへ移動（スワップ）
    if(prev && aOldPos){
      prev.pos=aOldPos;
      fa()[aOldPos]=prev.id;
    } else if(prev){
      prev.pos='―';
    }
    // Aをセレクトされたポジションへ
    fa()[faModalPos]=pid;
    if(p) p.pos=faModalPos;
    const msg=prev
      ? `${p?.name}↔${prev.name} ポジション交換`
      : `${p?.name} → ${faModalPos}`;
    closeFaModal(); saveState(); toast(msg); renderAll();
  } else {
    // クリア
    const prevId=fa()[faModalPos];
    if(prevId){ const prev=players.find(x=>x.id===prevId); if(prev) prev.pos='―'; }
    fa()[faModalPos]=null;
    closeFaModal(); saveState(); toast(`${faModalPos} クリア`); renderAll();
  }
}

function fillSlotUI(mode,pid){

  if(!pid){ sl.classList.remove('filled'); tx.innerHTML='<div class="sslot-empty">タップで選択</div>'; return; }

function doSub(){
  if(!subOutId||!subInId)return;
  const outP=players.find(p=>p.id===subOutId), inP=players.find(p=>p.id===subInId);
  if(!outP||!inP)return;
  inP.inStamen=true; inP.order=outP.order; inP.pos=outP.pos; inP.subbedOut=false;
  outP.inStamen=false; outP.order=null; outP.subbedOut=true;
  Object.keys(fa()).forEach(pos=>{ if(fa()[pos]===subOutId)fa()[pos]=subInId; });
  sl().unshift({outName:outP.name,inName:inP.name,pos:inP.pos,
    time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});
  saveState(); toast(`${outP.name} → ${inP.name} 交代完了`);
  subOutId=null; subInId=null;

}

function renderPitchList(){
  const el=document.getElementById('pitch-list'), cur=po();
  el.innerHTML=cur.length
    ? cur.map((item,i)=>{
        const p=players.find(x=>x.id===item.playerId); if(!p)return'';

                  :`<span class="pstat ps-n">${i+1}番手</span>`;
        return `<div class="pitch-row${sc}" data-idx="${i}" draggable="${item.status==='next'}"
          ondragstart="pDS(event,${i})" ondragover="pDO(event)" ondragleave="pDL(event)" ondragend="pDE(event)" ondrop="pDrop(event,${i})">
          <span class="pseq">${i+1}</span>
          <div class="pinfo"><div class="pname">${p.name}</div><div class="pkana">${p.kana}</div></div>
          <span class="pnum">${p.num??'—'}</span>${sl2}

      }).join('')
    : '<div style="text-align:center;color:var(--text3);font-size:11px;padding:14px;">下から投手を追加してください</div>';
}
let pDIdx=null;
function pDS(e,i){pDIdx=i;e.currentTarget.classList.add('dragging');}
function pDE(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.pitch-row.drag-over').forEach(r=>r.classList.remove('drag-over'));}
function pDO(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function pDL(e){e.currentTarget.classList.remove('drag-over');}
function pDrop(e,ti){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(pDIdx===null||pDIdx===ti)return;
  const cur=po(),mv=cur.splice(pDIdx,1)[0];cur.splice(ti,0,mv);
  pDIdx=null; saveState(); renderPitchList();
}
function addPitcher(){
  const pid=+document.getElementById('pit-sel').value; if(!pid)return;
  const cur=po();
  if(cur.find(x=>x.playerId===pid)){toast('既に追加済みです');return;}
  const isFirst=cur.length===0||cur.every(x=>x.status==='done');
  cur.push({playerId:pid,status:isFirst?'active':'next'});
  saveState(); toast(`${players.find(p=>p.id===pid)?.name} を追加`); renderPitchList();
}
function nextPitcher(){
  const cur=po(), ai=cur.findIndex(x=>x.status==='active');
  if(ai!==-1){ cur[ai].status='done';
    const ni=cur.findIndex(x=>x.status==='next');
    if(ni!==-1){cur[ni].status='active';toast(`${players.find(x=>x.id===cur[ni].playerId)?.name} が登板`);}
    else toast('次の投手はいません');
  } else {
    const ni=cur.findIndex(x=>x.status==='next');
    if(ni!==-1)cur[ni].status='active'; else toast('投手を追加してください');
  }
  saveState(); renderPitchList();
}

// SAVE / LOAD
// ══════════════════════════════════
function getState(){ return {players,nextId,fieldAssign,pitchOrder,subLog,currentTeam,ruleMode}; }
function applyState(d, fromRemote){
  if(d.players)    players    =d.players;
  if(d.nextId)     nextId     =d.nextId;
  if(d.fieldAssign)fieldAssign=d.fieldAssign;
  if(d.pitchOrder) pitchOrder =d.pitchOrder;
  if(d.subLog)     subLog     =d.subLog;
  // リモートからの同期時はチーム切替・タブ遷移を同期しない
  if(!fromRemote && d.currentTeam) currentTeam=d.currentTeam;
  if(d.ruleMode) ruleMode=d.ruleMode;
}
function saveState(){
  const s=getState();
  try{ localStorage.setItem(SAVE_KEY,JSON.stringify(s)); }catch(e){}
  fbSave(s);
}
function loadLocal(){
  try{
    const r=localStorage.getItem(SAVE_KEY);
    if(!r)return false;
    applyState(JSON.parse(r)); return true;
  }catch(e){return false;}
}

// ══════════════════════════════════
// FIREBASE
// ══════════════════════════════════
let fbApp=null, fbDb=null, fbOn=false, fbTimer=null, fbIgnoreTs=0, fbBlockUntil=0;

function initFb(cfg){
  try{
    // 既存アプリ削除
    if(fbApp){ try{fbApp.delete();}catch(e){} fbApp=null; fbDb=null; fbOn=false; }
    fbApp=firebase.initializeApp(cfg,'bbmgr');
    fbDb=firebase.database(fbApp);
    fbOn=true;
    // リアルタイム受信
    fbDb.ref('state').on('value',snap=>{
      const d=snap.val(); if(!d)return;
      // 自分が書いたデータ（またはそれ以前）は無視
      if(d._ts && d._ts <= fbIgnoreTs) return;
      if(Date.now() < fbBlockUntil) return;  // 書き込み直後はブロック
      if(fbTimer) return;
      applyState(d, true);  // リモート同期：チーム切替は引き継がない
      renderAll();
      if(document.getElementById('pg-pitcher').classList.contains('on')) renderPitchPage();
      if(document.getElementById('pg-settings').classList.contains('on')) renderSettingsPage();
      badge('📡 同期済');
    });
    badge('📡 接続完了');
  }catch(e){ console.warn('FB error',e); badge('⚠ 接続失敗'); }
}

function fbSave(state){
  if(!fbOn||!fbDb)return;
  clearTimeout(fbTimer);
  fbTimer=setTimeout(()=>{
    const ts=Date.now();
    fbIgnoreTs=ts;
    fbBlockUntil=ts+2000;   // 保存後2秒は受信ブロック
    fbDb.ref('state').set({...state,_ts:ts})
      .then(()=>badge('📡 同期完了'))
      .catch(()=>badge('⚠ 同期失敗'));
  },600);
}

function badge(msg){
  const el=document.getElementById('sync-badge');
  el.textContent=msg; el.style.opacity='1';
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity='0',2500);
}

function openFbModal(){
  const s=JSON.parse(localStorage.getItem('fb_cfg')||'{}');
  document.getElementById('fb-key').value=s.apiKey||'';
  document.getElementById('fb-pid').value=s.projectId||'';
  document.getElementById('fb-url').value=s.databaseURL||'';
  document.getElementById('fb-modal').classList.add('open');
}
function closeFbModal(){ document.getElementById('fb-modal').classList.remove('open'); }
function saveFbConfig(){
  const apiKey=document.getElementById('fb-key').value.trim();
  const projectId=document.getElementById('fb-pid').value.trim();
  const databaseURL=document.getElementById('fb-url').value.trim();
  if(!apiKey||!projectId||!databaseURL){toast('すべて入力してください');return;}
  const cfg={apiKey,authDomain:`${projectId}.firebaseapp.com`,databaseURL,projectId};
  localStorage.setItem('fb_cfg',JSON.stringify(cfg));
  closeFbModal();
  initFb(cfg);
}

// ══════════════════════════════════
// TOAST / INIT
// ══════════════════════════════════
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function fixVh(){ document.documentElement.style.setProperty('--vh',window.innerHeight*.01+'px'); }
fixVh(); window.addEventListener('resize',fixVh);

document.fonts.ready.then(()=>{
  setTimeout(()=>{ const s=document.getElementById('splash'); if(s){s.classList.add('hide');setTimeout(()=>s.remove(),400);} },700);
});
